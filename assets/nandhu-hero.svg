<svg width="920" height="300" viewBox="0 0 920 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="920" y2="300">
      <stop offset="0%" stop-color="#070B12"/>
      <stop offset="55%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="920" y2="0">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="45%" stop-color="#334155"/>
      <stop offset="72%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="name" x1="180" y1="80" x2="740" y2="190">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="45%" stop-color="#67E8F9">
        <animate attributeName="stop-color" values="#67E8F9;#A78BFA;#67E8F9" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#1E293B" stroke-width="1" opacity="0.38"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <clipPath id="panelClip"><rect x="1" y="1" width="918" height="298" rx="24"/></clipPath>
  </defs>

  <rect x="1" y="1" width="918" height="298" rx="24" fill="url(#bg)" stroke="url(#border)" stroke-width="1.5"/>
  <rect x="1" y="1" width="918" height="298" rx="24" fill="url(#grid)"/>

  <ellipse cx="460" cy="150" rx="285" ry="85" fill="#4F46E5" opacity="0.08" filter="url(#softGlow)"/>
  <ellipse cx="670" cy="160" rx="160" ry="70" fill="#06B6D4" opacity="0.05" filter="url(#softGlow)"/>

  <text x="34" y="34" fill="#64748B" font-family="monospace" font-size="11" letter-spacing="2">/PROFILE /IDENTITY</text>

  <circle cx="854" cy="29" r="4" fill="#22D3EE">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="880" y="34" text-anchor="end" fill="#64748B" font-family="monospace" font-size="11" letter-spacing="1.5">ONLINE</text>

  <text x="70" y="76" fill="#475569" font-family="monospace" font-size="12">$ whoami</text>
  <text x="138" y="76" fill="#67E8F9" font-family="monospace" font-size="12">nandhu</text>

  <text x="460" y="160" text-anchor="middle" fill="url(#name)" font-family="monospace" font-size="88" font-weight="800" letter-spacing="13">NANDHU</text>

  <rect x="260" y="180" width="400" height="2" rx="1" fill="url(#accent)">
    <animate attributeName="x" values="260;305;260" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="width" values="400;310;400" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <text x="460" y="216" text-anchor="middle" fill="#F1F5F9" font-family="Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="1.5">FULL-STACK DEVELOPER</text>
  <text x="460" y="241" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="12" letter-spacing="1.2">PYTHON · DJANGO · REACT · API ENGINEERING</text>

  <text x="34" y="276" fill="#475569" font-family="monospace" font-size="10" letter-spacing="1">BUILD · LEARN · SHIP</text>
  <text x="886" y="276" text-anchor="end" fill="#475569" font-family="monospace" font-size="10" letter-spacing="1">Ekaton // active</text>

  <rect x="-180" y="0" width="180" height="300" fill="url(#accent)" opacity="0.08" clip-path="url(#panelClip)">
    <animate attributeName="x" values="-180;920" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>